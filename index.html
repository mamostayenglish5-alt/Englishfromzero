<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English From Zero - Audio Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Box */
        .header-box {
            background-color: #EEEBE3;
            border: 1px solid #dcd7ce;
            padding: 10px 30px;
            text-align: center;
            margin-bottom: 25px;
            border-radius: 4px;
        }
        .header-box h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #000;
        }
        .header-box p {
            margin: 0;
            font-size: 16px;
            color: #000;
        }

        /* Player Widget Container */
        .player-container {
            width: 420px;
            background: #C7C0B3;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        /* Top part of player */
        .player-top {
            background-color: #EEEBE3;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .time-display {
            font-size: 16px;
            font-weight: 500;
            color: #111;
        }

        .track-name-display {
            background-color: #EEEBE3;
            text-align: center;
            padding: 8px 15px 10px;
            font-size: 15px;
            font-weight: bold;
            color: #332f28;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-bar-container {
            flex-grow: 1;
            margin: 0 15px;
            position: relative;
            cursor: pointer;
            height: 20px;
            display: flex;
            align-items: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #b5b0a6;
            border-radius: 3px;
        }

        .progress-bar-fill {
            position: absolute;
            height: 6px;
            background-color: #332f28;
            border-radius: 3px;
            width: 0%;
        }

        .progress-thumb {
            position: absolute;
            left: 0%;
            width: 14px;
            height: 14px;
            background-color: #222;
            border-radius: 50%;
            transform: translateX(-50%);
        }

        /* Bottom part of player */
        .player-bottom {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-btn {
            background-color: rgba(255, 255, 255, 0.3);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }

        .player-btn:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }

        /* Main Play/Pause Button */
        .play-pause-btn {
            background-color: #ffffff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            font-size: 18px;
        }

        .play-pause-btn:hover {
            background-color: #f2f2f2;
        }

        /* Tracks Grid Container */
        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 500px;
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }

        .track-btn {
            background-color: #C7C0B3;
            border: 1px solid #9c9588;
            padding: 8px 5px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .track-btn:hover {
            background-color: #b8b0a2;
        }

        .track-btn.active {
            background-color: #332f28;
            color: #fff;
            border-color: #111;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-box">
        <h2>English From Zero</h2>
        <p>By: Khalid Qubady</p>
    </div>

    <!-- Audio Player Widget -->
    <div class="player-container">
        <!-- Top Section -->
        <div class="track-name-display" id="track-name">Track 1</div>
        <div class="player-top">
            <span class="time-display" id="current-time">0:00</span>
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar-bg"></div>
                <div class="progress-bar-fill" id="progress-fill"></div>
                <div class="progress-thumb" id="progress-thumb"></div>
            </div>
            <span class="time-display" id="duration-time">0:00</span>
        </div>

        <!-- Bottom Section -->
        <div class="player-bottom">
            <button class="player-btn" id="loop-btn" title="Loop">🔁</button>
            <button class="player-btn" id="prev-btn" title="Previous Track">⏮</button>
            <button class="play-pause-btn" id="play-pause-btn" title="Play/Pause">▶</button>
            <button class="player-btn" id="next-btn" title="Next Track">⏭</button>
            <button class="player-btn" id="vol-btn" title="Mute/Unmute">🔊</button>
        </div>
    </div>

    <!-- 100 Tracks Grid Container -->
    <div class="tracks-grid" id="tracks-grid"></div>

    <!-- Hidden HTML5 Audio Element -->
    <audio id="audio-element"></audio>

            { id: 98, title: `Track 98`, file: `audio/98.mp3` },
            { id: 99, title: `Track 99`, file: `audio/99.mp3` },
            { id: 100, title: `Track 100`, file: `audio/100.mp3` }
        ];

        let currentTrackIndex = 0;
        const audioElement = document.getElementById('audio-element');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const loopBtn = document.getElementById('loop-btn');
        const volBtn = document.getElementById('vol-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressThumb = document.getElementById('progress-thumb');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const trackNameEl = document.getElementById('track-name');
        const tracksGrid = document.getElementById('tracks-grid');

        // Render 100 Track Buttons dynamically
        function renderTracks() {
            tracksGrid.innerHTML = '';
            tracks.forEach((track, index) => {
                const btn = document.createElement('button');
                btn.className = `track-btn ${index === currentTrackIndex ? 'active' : ''}`;
                btn.innerText = `${track.id}. ${track.title}`; // Matches your label style
                btn.onclick = () => loadAndPlayTrack(index);
                tracksGrid.appendChild(btn);
            });
        }

        function loadAndPlayTrack(index) {
            currentTrackIndex = index;
            audioElement.src = tracks[index].file;
            trackNameEl.innerText = tracks[index].title;
            audioElement.play().catch(e => {
                console.log("Playback error or missing file:", e);
            });
            updateActiveButton();
            playPauseBtn.innerText = '⏸';
        }

        function updateActiveButton() {
            const buttons = tracksGrid.querySelectorAll('.track-btn');
            buttons.forEach((btn, idx) => {
                if (idx === currentTrackIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Play / Pause Toggle
        playPauseBtn.onclick = () => {
            if (!audioElement.src) {
                loadAndPlayTrack(0);
                return;
            }
            if (audioElement.paused) {
                audioElement.play();
                playPauseBtn.innerText = '⏸';
            } else {
                audioElement.pause();
                playPauseBtn.innerText = '▶';
            }
        };

        // Next & Previous controls
        nextBtn.onclick = () => {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadAndPlayTrack(currentTrackIndex);
        };

        prevBtn.onclick = () => {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadAndPlayTrack(currentTrackIndex);
        };

        // Loop control
        let isLooping = false;
        loopBtn.onclick = () => {
            isLooping = !isLooping;
            audioElement.loop = isLooping;
            loopBtn.style.backgroundColor = isLooping ? 'rgba(255, 255, 255, 0.7)' : 'rgba(255, 255, 255, 0.3)';
        };

        // Mute control
        let isMuted = false;
        volBtn.onclick = () => {
            isMuted = !isMuted;
            audioElement.muted = isMuted;
            volBtn.innerText = isMuted ? '🔇' : '🔊';
        };

        // Update progress bar & timers
        audioElement.ontimeupdate = () => {
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                progressThumb.style.left = `${progressPercent}%`;
                
                currentTimeEl.innerText = formatTime(audioElement.currentTime);
                durationTimeEl.innerText = formatTime(audioElement.duration);
            }
        };

        // Click on progress bar to seek
        progressContainer.onclick = (e) => {
            if (!audioElement.duration) return;
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            audioElement.currentTime = (clickX / width) * audioElement.duration;
        };

        // Auto play next track when ended
        audioElement.onended = () => {
            if (!audioElement.loop) {
                nextBtn.click();
            }
        };

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Initialize grid on load
        renderTracks();
        trackNameEl.innerText = tracks[currentTrackIndex].title;
    </script>
